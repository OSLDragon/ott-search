    - name: Build Debug APK Directly
      run: |
        if gradle assembleDebug --no-daemon > build.log 2>&1; then
          echo "### ✅ DragOTT v3.1 (동양용 트라이벌 아이콘 + 보안격리 + 자동프로필) 빌드 성공!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ 빌드 오류 상세 원인" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILURE|What went wrong|Execution failed|^> |^e: )" -A 8 build.log >> $GITHUB_STEP_SUMMARY || tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log
          exit 1
        fi

