        files["app/src/main/java/com/ottsearch/app/ott/OttAutoSearchService.kt"] = """
        package com.ottsearch.app.ott

        import android.accessibilityservice.AccessibilityService
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityNodeInfo
        import android.widget.Toast

        class OttAutoSearchService : AccessibilityService() {

            companion object {
                @Volatile var targetPackage: String? = null
                @Volatile var targetQuery: String? = null
                @Volatile var startTime: Long = 0L
                @Volatile var textInjected: Boolean = false
                @Volatile var textInjectedTime: Long = 0L
                @Volatile var lastTabClickTime: Long = 0L
                @Volatile var lastPlaceholderClickTime: Long = 0L

                fun startAutoSearch(pkg: String, query: String) {
                    targetPackage = pkg
                    targetQuery = query.trim()
                    startTime = System.currentTimeMillis()
                    textInjected = false
                    textInjectedTime = 0L
                    lastTabClickTime = 0L
                    lastPlaceholderClickTime = 0L
                }
            }

            private val handler = Handler(Looper.getMainLooper())
            private val pollRunnable = object : Runnable {
                override fun run() {
                    processScreen()
                    val pkg = targetPackage
                    if (pkg != null && System.currentTimeMillis() - startTime < 30000L) {
                        handler.postDelayed(this, 350L)
                    } else {
                        targetPackage = null
                        targetQuery = null
                    }
                }
            }

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                val pkg = targetPackage ?: return
                if (System.currentTimeMillis() - startTime > 30000L) {
                    targetPackage = null
                    targetQuery = null
                    return
                }
                handler.removeCallbacks(pollRunnable)
                handler.post(pollRunnable)
            }

            override fun onInterrupt() {}

            private fun processScreen() {
                val pkg = targetPackage ?: return
                val query = targetQuery ?: return
                val now = System.currentTimeMillis()
                if (now - startTime > 30000L) {
                    targetPackage = null
                    targetQuery = null
                    return
                }

                val root = rootInActiveWindow ?: return
                val currentPkg = root.packageName?.toString() ?: ""
                if (currentPkg != pkg) return

                // [프로필 선택 화면 감지] 사용자가 프로필(오승용, 민트맘 등)을 선택할 때까지 대기 시간 연장하며 홀드
                if (isProfileSelectionScreen(root)) {
                    startTime = now
                    return
                }

                val editNode = findEditableNode(root)
                if (editNode != null) {
                    if (!textInjected) {
                        performClickOnNodeOrParent(editNode)
                        editNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                        val args = Bundle()
                        args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, query)
                        val ok = editNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                        if (!ok) {
                            editNode.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                        }
                        textInjected = true
                        textInjectedTime = now
                        return
                    } else if (now - textInjectedTime >= 400L) {
                        val currentText = editNode.text?.toString() ?: ""
                        if (!currentText.contains(query.take(1))) {
                            val args = Bundle()
                            args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, query)
                            editNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                        }
                        editNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                        if (Build.VERSION.SDK_INT >= 30) {
                            editNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                        }
                        val submitBtn = findSubmitButton(root, editNode)
                        if (submitBtn != null) {
                            performClickOnNodeOrParent(submitBtn)
                        }
                        Toast.makeText(applicationContext, "‘$query’ 자동 검색 완료!", Toast.LENGTH_SHORT).show()
                        targetPackage = null
                        targetQuery = null
                        return
                    }
                    return
                }

                if (now - lastPlaceholderClickTime > 1000L) {
                    val placeholder = findSearchBoxPlaceholder(root)
                    if (placeholder != null) {
                        if (performClickOnNodeOrParent(placeholder)) {
                            lastPlaceholderClickTime = now
                            return
                        }
                    }
                }

                if (now - lastTabClickTime > 1300L) {
                    val searchTab = findSearchTabOrIcon(root)
                    if (searchTab != null) {
                        if (performClickOnNodeOrParent(searchTab)) {
                            lastTabClickTime = now
                            return
                        }
                    }
                }
            }

            private fun isProfileSelectionScreen(node: AccessibilityNodeInfo?): Boolean {
                if (node == null) return false
                if (node.isVisibleToUser) {
                    val t = node.text?.toString() ?: ""
                    val cd = node.contentDescription?.toString() ?: ""
                    val combined = "$t $cd"
                    if (combined.contains("프로필을 선택") || combined.contains("프로필 선택") ||
                        combined.contains("시청할 프로필") || combined.contains("누가 시청") ||
                        combined.contains("프로필 관리") || combined.lowercase().contains("who's watching")) {
                        return true
                    }
                }
                for (i in 0 until node.childCount) {
                    if (isProfileSelectionScreen(node.getChild(i))) return true
                }
                return false
            }

            private fun findEditableNode(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                if (node == null) return null
                if (!node.isVisibleToUser || node.isPassword) return null
                val cls = node.className?.toString() ?: ""
                val canSetText = node.actionList?.any { it.id == AccessibilityNodeInfo.ACTION_SET_TEXT } == true
                if (node.isEditable || canSetText || cls.contains("EditText", ignoreCase = true) || cls.contains("AutoComplete", ignoreCase = true)) {
                    return node
                }
                for (i in 0 until node.childCount) {
                    val found = findEditableNode(node.getChild(i))
                    if (found != null) return found
                }
                return null
            }

            private fun findSearchBoxPlaceholder(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                if (node == null || !node.isVisibleToUser) return null
                val t = node.text?.toString() ?: ""
                val cd = node.contentDescription?.toString() ?: ""
                val hint = if (Build.VERSION.SDK_INT >= 26) node.hintText?.toString() ?: "" else ""
                val combined = "$t $cd $hint"
                val viewId = node.viewIdResourceName?.lowercase() ?: ""

                val hasHintWord = combined.contains("검색어") || combined.contains("입력") ||
                    combined.contains("제목, 캐릭터") || combined.contains("제목, 장르") ||
                    combined.contains("출연진") || combined.contains("찾아보세요") ||
                    combined.contains("콘텐츠, 인물") || combined.lowercase().contains("search by")
                val hasBoxId = viewId.contains("search_bar") || viewId.contains("search_box") ||
                    viewId.contains("search_src_text") || viewId.contains("search_edit") ||
                    viewId.contains("et_search") || viewId.contains("search_input") ||
                    viewId.contains("search_text")

                if (hasHintWord || hasBoxId) {
                    return node
                }
                for (i in 0 until node.childCount) {
                    val found = findSearchBoxPlaceholder(node.getChild(i))
                    if (found != null) return found
                }
                return null
            }

            private fun findSearchTabOrIcon(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                if (node == null || !node.isVisibleToUser) return null
                val t = node.text?.toString()?.trim() ?: ""
                val cd = node.contentDescription?.toString()?.trim() ?: ""
                val viewId = node.viewIdResourceName?.lowercase() ?: ""

                val isExactLabel = t.equals("검색", ignoreCase = true) || t.equals("search", ignoreCase = true) ||
                    cd.equals("검색", ignoreCase = true) || cd.equals("search", ignoreCase = true) ||
                    cd.contains("검색 버튼") || cd.contains("검색 탭") || cd.contains("검색하기")
                val isSearchId = viewId.contains("search") && (
                    viewId.contains("tab") || viewId.contains("menu") ||
                    viewId.contains("btn") || viewId.contains("icon") ||
                    viewId.contains("action") || viewId.contains("nav") ||
                    viewId.endsWith("/search")
                )

                if (isExactLabel || isSearchId) {
                    return node
                }
                for (i in 0 until node.childCount) {
                    val found = findSearchTabOrIcon(node.getChild(i))
                    if (found != null) return found
                }
                return null
            }

            private fun findSubmitButton(node: AccessibilityNodeInfo?, editNode: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                if (node == null || !node.isVisibleToUser || node == editNode) return null
                val viewId = node.viewIdResourceName?.lowercase() ?: ""
                val cd = node.contentDescription?.toString()?.trim() ?: ""
                val isClearBtn = viewId.contains("clear") || viewId.contains("close") || viewId.contains("delete") ||
                    cd.contains("지우기") || cd.contains("삭제") || cd.contains("닫기") || cd.lowercase().contains("clear")
                if (!isClearBtn) {
                    val isSubmit = (viewId.contains("btn_search") || viewId.contains("search_btn") || viewId.contains("iv_search")) &&
                        node.isClickable
                    if (isSubmit) return node
                }
                for (i in 0 until node.childCount) {
                    val found = findSubmitButton(node.getChild(i), editNode)
                    if (found != null) return found
                }
                return null
            }

            private fun performClickOnNodeOrParent(node: AccessibilityNodeInfo?): Boolean {
                var curr = node
                var depth = 0
                while (curr != null && depth < 6) {
                    if (curr.isClickable) {
                        if (curr.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                    }
                    curr = curr.parent
                    depth++
                }
                return node?.performAction(AccessibilityNodeInfo.ACTION_CLICK) ?: false
            }
        }
        """

        files["app/src/main/java/com/ottsearch/app/ott/OttLauncher.kt"] = """
        package com.ottsearch.app.ott

        import android.app.SearchManager
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.provider.Settings
        import android.widget.Toast

        enum class OttType(val displayName: String, val packageName: String, val r: Int, val g: Int, val b: Int) {
            NETFLIX("Netflix", "com.netflix.mediaclient", 229, 9, 20),
            WAVVE("Wavve", "kr.co.captv.pooqV2", 19, 83, 250),
            COUPANG_PLAY("Coupang Play", "com.coupang.mobile.play", 0, 160, 233),
            DISNEY_PLUS("Disney+", "com.disney.disneyplus", 17, 60, 207)
        }

        object OttLauncher {
            fun isAccessibilityEnabled(context: Context): Boolean {
                val enabledServices = Settings.Secure.getString(
                    context.contentResolver,
                    Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                ) ?: return false
                return enabledServices.contains(context.packageName)
            }

            fun openAccessibilitySettings(context: Context) {
                val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                }
                context.startActivity(intent)
            }

            fun openAppDetailSettings(context: Context) {
                val intent = Intent(
                    Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                    Uri.parse("package:${context.packageName}")
                ).apply {
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                }
                context.startActivity(intent)
            }

            fun launch(context: Context, ott: OttType, searchQuery: String) {
                val cleanQuery = searchQuery.trim()
                val pm = context.packageManager
                val isInstalled = try {
                    pm.getPackageInfo(ott.packageName, 0)
                    true
                } catch (e: Exception) {
                    false
                }

                copyToClipboard(context, cleanQuery)

                if (!isInstalled) {
                    Toast.makeText(context, "${ott.displayName} 앱이 설치되어 있지 않아 스토어로 이동합니다.", Toast.LENGTH_SHORT).show()
                    context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=${ott.packageName}")))
                    return
                }

                OttAutoSearchService.startAutoSearch(ott.packageName, cleanQuery)

                try {
                    val launchIntent = pm.getLaunchIntentForPackage(ott.packageName)?.apply {
                        addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                    }
                    if (launchIntent != null) {
                        context.startActivity(launchIntent)
                    }
                    if (!isAccessibilityEnabled(context)) {
                        Toast.makeText(context, "상단의 ‘2. 접근성 권한 켜기’를 활성화하면 프로필 선택 후에도 자동 검색됩니다!", Toast.LENGTH_LONG).show()
                    }
                } catch (e: Exception) {
                    Toast.makeText(context, "${ott.displayName} 실행 중 오류가 발생했습니다.", Toast.LENGTH_SHORT).show()
                }
            }

            private fun copyToClipboard(context: Context, text: String) {
                val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                clipboard.setPrimaryClip(ClipData.newPlainText("OTT_SEARCH_QUERY", text))
            }
        }
        """

