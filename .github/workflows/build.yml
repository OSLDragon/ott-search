            fun convertDubeolsik(input: String): String {
                val strokes = StringBuilder()
                for (ch in input) strokes.append(ENG_TO_KOR[ch] ?: ch)
                val s = strokes.toString()
                val result = StringBuilder()
                var i = 0
                val n = s.length
                while (i < n) {
                    val c = s[i]
                    if (c in CHOSUNG) {
                        val cho = c
                        if (i + 1 < n && s[i + 1] in JUNGSUNG) {
                            var jung = s[i + 1]
                            i += 2
                            if (i < n && COMPLEX_VOWEL.containsKey(Pair(jung, s[i]))) {
                                jung = COMPLEX_VOWEL[Pair(jung, s[i])]!!
                                i += 1
                            }
                            var jong = ""
                            if (i < n && JONGSUNG.contains(s[i].toString()) && s[i].toString().isNotEmpty()) {
                                if (!(i + 1 < n && s[i + 1] in JUNGSUNG)) {
                                    jong = s[i].toString()
                                    i += 1
                                    if (i < n && COMPLEX_CONSONANT.containsKey(Pair(jong[0], s[i]))) {
                                        if (!(i + 1 < n && s[i + 1] in JUNGSUNG)) {
                                            jong = COMPLEX_CONSONANT[Pair(jong[0], s[i])]!!
                                            i += 1
                                        }
                                    }
                                }
                            }
                            val choIdx = CHOSUNG.indexOf(cho)
                            val jungIdx = JUNGSUNG.indexOf(jung)
                            val jongIdx = JONGSUNG.indexOf(jong)
                            val unicode = 0xAC00 + (choIdx * 21 + jungIdx) * 28 + jongIdx
                            result.append(unicode.toChar())
                        } else {
                            result.append(cho)
                            i += 1
                        }
                    } else if (c in JUNGSUNG) {
                        var jung = c
                        i += 1
                        if (i < n && COMPLEX_VOWEL.containsKey(Pair(jung, s[i]))) {
                            jung = COMPLEX_VOWEL[Pair(jung, s[i])]!!
                            i += 1
                        }
                        result.append(jung)
                    } else {
                        result.append(c)
                        i += 1
                    }
                }
                return result.toString()
            }

            private fun norm(s: String): String = s.filter { !it.isWhitespace() }.lowercase()

            private fun levenshtein(s1: String, s2: String): Int {
                val dp = Array(s1.length + 1) { IntArray(s2.length + 1) }
                for (i in 0..s1.length) dp[i][0] = i
                for (j in 0..s2.length) dp[0][j] = j
                for (i in 1..s1.length) {
                    for (j in 1..s2.length) {
                        val cost = if (s1[i - 1] == s2[j - 1]) 0 else 1
                        dp[i][j] = minOf(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost)
                    }
                }
                return dp[s1.length][s2.length]
            }

            fun scoreItem(qRaw: String, item: ContentUiModel): Double {
                val qNorm = norm(qRaw)
                val qConv = convertDubeolsik(qRaw)
                val qConvNorm = norm(qConv)

                val candidates = mutableListOf(Pair(item.titleKo, 1.0), Pair(item.originalTitle, 0.95))
                for (al in item.aliases) candidates.add(Pair(al, 1.0))

                var best = 0.0
                for ((cand, w) in candidates) {
                    if (cand.isBlank()) continue
                    val cRaw = cand.trim()
                    val cNorm = norm(cRaw)
                    val tier = when {
                        qRaw.equals(cRaw, ignoreCase = true) -> 10000.0
                        qNorm == cNorm -> 8000.0
                        qConv.isNotEmpty() && (qConv.equals(cRaw, ignoreCase = true) || qConvNorm == cNorm) -> 7500.0
                        cNorm.startsWith(qNorm) || (qConvNorm.isNotEmpty() && cNorm.startsWith(qConvNorm)) -> 5000.0
                        cNorm.contains(qNorm) || (qConvNorm.isNotEmpty() && cNorm.contains(qConvNorm)) -> 3000.0
                        else -> {
                            val d1 = levenshtein(qNorm, cNorm)
                            val d2 = if (qConvNorm.isNotEmpty()) levenshtein(qConvNorm, cNorm) else 99
                            val d = minOf(d1, d2)
                            val m = maxOf(qNorm.length, cNorm.length)
                            if (m > 0 && d <= 2) (1.0 - d.toDouble() / m) * 2000.0 else 0.0
                        }
                    }
                    val s = tier * w
                    if (s > best) best = s
                }
                return if (best > 0.0) best + item.popularity * 10.0 else 0.0
            }

            fun searchLocal(query: String): List<ContentUiModel> {
                val qRaw = query.trim()
                if (qRaw.isEmpty()) return CATALOG
                val scored = mutableListOf<Pair<ContentUiModel, Double>>()
                for (item in CATALOG) {
                    val s = scoreItem(qRaw, item)
                    if (s > 0.0) scored.add(Pair(item, s))
                }
                return scored.sortedByDescending { it.second }.map { it.first }
            }

            fun searchLive(query: String, tmdbApiKey: String): List<ContentUiModel> {
                val qRaw = query.trim()
                if (qRaw.isEmpty()) return CATALOG

                val localMatches = searchLocal(qRaw).toMutableList()
                val conv = convertDubeolsik(qRaw)
                val effectiveQuery = if (conv != qRaw && conv.any { it in '가'..'힣' }) conv else qRaw

                val remoteMatches = mutableListOf<ContentUiModel>()

                if (tmdbApiKey.isNotBlank()) {
                    remoteMatches.addAll(fetchFromTmdb(effectiveQuery, tmdbApiKey))
                }

                if (remoteMatches.isEmpty()) {
                    remoteMatches.addAll(fetchFromItunesKr(effectiveQuery))
                }

                val combined = mutableListOf<ContentUiModel>()
                val seenTitles = mutableSetOf<String>()

                for (item in localMatches) {
                    val key = norm(item.titleKo) + item.year
                    if (seenTitles.add(key)) combined.add(item)
                }
                for (item in remoteMatches) {
                    val key = norm(item.titleKo) + item.year
                    if (seenTitles.add(key)) combined.add(item)
                }

                if (combined.isEmpty()) {
                    combined.add(
                        ContentUiModel(
                            id = 99999,
                            titleKo = effectiveQuery,
                            originalTitle = "4대 OTT 앱에서 직접 자동 검색",
                            year = "자동입력",
                            mediaType = "직접검색",
                            activeOtts = setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY, OttType.DISNEY_PLUS),
                            providerVerified = false
                        )
                    )
                }
                return combined
            }

            private fun fetchFromTmdb(query: String, apiKey: String): List<ContentUiModel> {
                val list = mutableListOf<ContentUiModel>()
                try {
                    val enc = URLEncoder.encode(query, "UTF-8")
                    val url = "https://api.themoviedb.org/3/search/multi?api_key=$apiKey&query=$enc&language=ko-KR&region=KR"
                    val jsonStr = httpGet(url) ?: return list
                    val root = JSONObject(jsonStr)
                    val results = root.optJSONArray("results") ?: return list

                    val limit = minOf(results.length(), 8)
                    for (i in 0 until limit) {
                        val obj = results.getJSONObject(i)
                        val mediaType = obj.optString("media_type", "")
                        if (mediaType != "movie" && mediaType != "tv") continue
                        val id = obj.optInt("id", 0)
                        val titleKo = if (mediaType == "movie") obj.optString("title", "") else obj.optString("name", "")
                        val origTitle = if (mediaType == "movie") obj.optString("original_title", "") else obj.optString("original_name", "")
                        val date = if (mediaType == "movie") obj.optString("release_date", "") else obj.optString("first_air_date", "")
                        val year = if (date.length >= 4) date.substring(0, 4) else "미상"
                        val posterPath = obj.optString("poster_path", "")
                        val posterUrl = if (posterPath.isNotBlank() && posterPath != "null") "https://image.tmdb.org/t/p/w342$posterPath" else ""
                        val pop = obj.optDouble("popularity", 10.0)

                        val otts = fetchTmdbKrProviders(mediaType, id, apiKey)
                        list.add(
                            ContentUiModel(
                                id = id,
                                titleKo = if (titleKo.isNotBlank()) titleKo else origTitle,
                                originalTitle = origTitle,
                                year = year,
                                mediaType = if (mediaType == "movie") "영화" else "시리즈",
                                activeOtts = otts,
                                popularity = pop,
                                posterUrl = posterUrl,
                                providerVerified = true
                            )
                        )
                    }
                } catch (e: Exception) {}
                return list
            }

            private fun fetchTmdbKrProviders(mediaType: String, id: Int, apiKey: String): Set<OttType> {
                val set = mutableSetOf<OttType>()
                try {
                    val url = "https://api.themoviedb.org/3/$mediaType/$id/watch/providers?api_key=$apiKey"
                    val jsonStr = httpGet(url) ?: return set
                    val kr = JSONObject(jsonStr).optJSONObject("results")?.optJSONObject("KR") ?: return set
                    val flatrate = kr.optJSONArray("flatrate") ?: return set
                    for (i in 0 until flatrate.length()) {
                        val p = flatrate.getJSONObject(i)
                        val pid = p.optInt("provider_id", 0)
                        val pname = p.optString("provider_name", "").lowercase()
                        if (pid == 1796 || pname.contains("tving")) continue
                        when {
                            pid == 8 || pname.contains("netflix") -> set.add(OttType.NETFLIX)
                            pid == 356 || pname.contains("wavve") -> set.add(OttType.WAVVE)
                            pid == 1881 || pid == 357 || pname.contains("coupang") -> set.add(OttType.COUPANG_PLAY)
                            pid == 337 || pname.contains("disney") -> set.add(OttType.DISNEY_PLUS)
                        }
                    }
                } catch (e: Exception) {}
                return set
            }

            private fun fetchFromItunesKr(query: String): List<ContentUiModel> {
                val list = mutableListOf<ContentUiModel>()
                try {
                    val enc = URLEncoder.encode(query, "UTF-8")
                    val url = "https://itunes.apple.com/search?term=$enc&country=KR&lang=ko_kr&media=movie&limit=8"
                    val jsonStr = httpGet(url) ?: return list
                    val results = JSONObject(jsonStr).optJSONArray("results") ?: return list
                    for (i in 0 until results.length()) {
                        val obj = results.getJSONObject(i)
                        val title = obj.optString("trackName", "")
                        if (title.isBlank()) continue
                        val artist = obj.optString("artistName", "")
                        val date = obj.optString("releaseDate", "")
                        val year = if (date.length >= 4) date.substring(0, 4) else ""
                        val art = obj.optString("artworkUrl100", "").replace("100x100bb", "400x600bb")
                        list.add(
                            ContentUiModel(
                                id = obj.optInt("trackId", 10000 + i),
                                titleKo = title,
                                originalTitle = if (artist.isNotBlank()) "감독: $artist" else title,
                                year = year,
                                mediaType = "영화",
                                activeOtts = emptySet(),
                                posterUrl = art,
                                providerVerified = false
                            )
                        )
                    }
                } catch (e: Exception) {}
                return list
            }

            fun fetchPosterForTitle(title: String): String {
                try {
                    val enc = URLEncoder.encode(title, "UTF-8")
                    val url = "https://itunes.apple.com/search?term=$enc&country=KR&lang=ko_kr&media=movie&limit=1"
                    val jsonStr = httpGet(url) ?: return ""
                    val results = JSONObject(jsonStr).optJSONArray("results")
                    if (results != null && results.length() > 0) {
                        val art = results.getJSONObject(0).optString("artworkUrl100", "")
                        if (art.isNotBlank()) return art.replace("100x100bb", "400x600bb")
                    }
                } catch (e: Exception) {}
                return ""
            }

            private fun httpGet(urlStr: String): String? {
                var conn: HttpURLConnection? = null
                return try {
                    conn = URL(urlStr).openConnection() as HttpURLConnection
                    conn.connectTimeout = 4000
                    conn.readTimeout = 4000
                    conn.requestMethod = "GET"
                    if (conn.responseCode == 200) {
                        conn.inputStream.bufferedReader().use { it.readText() }
                    } else null
                } catch (e: Exception) {
                    null
                } finally {
                    conn?.disconnect()
                }
            }
        }
