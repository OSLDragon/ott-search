name: Build OTT Search APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle 8.5
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
        unzip -q gradle.zip -d /tmp
        echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Configure Android SDK Path
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Create Project Files
      shell: python
      run: |
        import os

        files = {}

        files["gradle.properties"] = """
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        """

        files["settings.gradle.kts"] = """
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "OTT-Search"
        include(":app")
        """

        files["build.gradle.kts"] = """
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        """

        files["app/build.gradle.kts"] = """
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.ottsearch.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.ottsearch.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
            implementation("androidx.activity:activity-compose:1.8.1")
            implementation(platform("androidx.compose:compose-bom:2023.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.foundation:foundation")
        }
        """

        files["app/src/main/res/values/strings.xml"] = """
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">OTT Search</string>
        </resources>
        """

        files["app/src/main/AndroidManifest.xml"] = """
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <queries>
                <package android:name="com.netflix.mediaclient" />
                <package android:name="kr.co.captv.pooqV2" />
                <package android:name="com.coupang.mobile.play" />
                <package android:name="com.disney.disneyplus" />
                <intent>
                    <action android:name="android.intent.action.VIEW" />
                    <data android:scheme="https" />
                </intent>
            </queries>

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity
                    android:name="com.ottsearch.app.MainActivity"
                    android:exported="true"
                    android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        """

        files["app/src/main/java/com/ottsearch/app/ott/OttLauncher.kt"] = """
        package com.ottsearch.app.ott

        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.widget.Toast
        import java.net.URLEncoder

        enum class OttType(val displayName: String, val packageName: String, val r: Int, val g: Int, val b: Int) {
            NETFLIX("Netflix", "com.netflix.mediaclient", 229, 9, 20),
            WAVVE("Wavve", "kr.co.captv.pooqV2", 19, 83, 250),
            COUPANG_PLAY("Coupang Play", "com.coupang.mobile.play", 0, 160, 233),
            DISNEY_PLUS("Disney+", "com.disney.disneyplus", 17, 60, 207)
        }

        object OttLauncher {
            fun launch(context: Context, ott: OttType, searchQuery: String) {
                val encodedQuery = URLEncoder.encode(searchQuery.trim(), "UTF-8")
                val pm = context.packageManager
                val isInstalled = try {
                    pm.getPackageInfo(ott.packageName, 0)
                    true
                } catch (e: Exception) {
                    false
                }

                copyToClipboard(context, searchQuery)

                if (!isInstalled) {
                    Toast.makeText(context, "${ott.displayName} 앱이 설치되어 있지 않아 스토어로 이동합니다.", Toast.LENGTH_SHORT).show()
                    context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=${ott.packageName}")))
                    return
                }

                val intent = when (ott) {
                    OttType.NETFLIX -> Intent(Intent.ACTION_VIEW, Uri.parse("netflix://search?query=$encodedQuery")).apply { setPackage(ott.packageName) }
                    OttType.WAVVE -> Intent(Intent.ACTION_VIEW, Uri.parse("https://www.wavve.com/search?searchWord=$encodedQuery")).apply { setPackage(ott.packageName) }
                    OttType.COUPANG_PLAY -> pm.getLaunchIntentForPackage(ott.packageName)
                    OttType.DISNEY_PLUS -> pm.getLaunchIntentForPackage(ott.packageName)
                }

                try {
                    if (intent != null && intent.resolveActivity(pm) != null) {
                        context.startActivity(intent)
                    } else {
                        pm.getLaunchIntentForPackage(ott.packageName)?.let { context.startActivity(it) }
                    }
                    Toast.makeText(context, "‘$searchQuery’ 복사 완료! 검색창에 바로 붙여넣으세요.", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    pm.getLaunchIntentForPackage(ott.packageName)?.let { context.startActivity(it) }
                }
            }

            private fun copyToClipboard(context: Context, text: String) {
                val clipboard = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                clipboard.setPrimaryClip(ClipData.newPlainText("OTT_SEARCH_QUERY", text))
            }
        }
        """

        files["app/src/main/java/com/ottsearch/app/core/HangulSearchEngine.kt"] = """
        package com.ottsearch.app.core

        import com.ottsearch.app.ott.OttType
        import com.ottsearch.app.ui.ContentUiModel

        object HangulSearchEngine {
            private val ENG_TO_KOR = mapOf(
                'q' to 'ㅂ', 'w' to 'ㅈ', 'e' to 'ㄷ', 'r' to 'ㄱ', 't' to 'ㅅ', 'y' to 'ㅛ', 'u' to 'ㅕ', 'i' to 'ㅑ', 'o' to 'ㅐ', 'p' to 'ㅔ',
                'a' to 'ㅁ', 's' to 'ㄴ', 'd' to 'ㅇ', 'f' to 'ㄹ', 'g' to 'ㅎ', 'h' to 'ㅗ', 'j' to 'ㅓ', 'k' to 'ㅏ', 'l' to 'ㅣ',
                'z' to 'ㅋ', 'x' to 'ㅌ', 'c' to 'ㅊ', 'v' to 'ㅍ', 'b' to 'ㅠ', 'n' to 'ㅜ', 'm' to 'ㅡ',
                'Q' to 'ㅃ', 'W' to 'ㅉ', 'E' to 'ㄸ', 'R' to 'ㄲ', 'T' to 'ㅆ', 'O' to 'ㅒ', 'P' to 'ㅖ'
            )
            private val CHOSUNG = listOf('ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ')
            private val JUNGSUNG = listOf('ㅏ', 'ㅐ', 'ㅑ', 'ㅒ', 'ㅓ', 'ㅔ', 'ㅕ', 'ㅖ', 'ㅗ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅛ', 'ㅜ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅠ', 'ㅡ', 'ㅢ', 'ㅣ')
            private val JONGSUNG = listOf("", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ")

            private val COMPLEX_VOWEL = mapOf(
                Pair('ㅗ', 'ㅏ') to 'ㅘ', Pair('ㅗ', 'ㅐ') to 'ㅙ', Pair('ㅗ', 'ㅣ') to 'ㅚ',
                Pair('ㅜ', 'ㅓ') to 'ㅝ', Pair('ㅜ', 'ㅔ') to 'ㅞ', Pair('ㅜ', 'ㅣ') to 'ㅟ',
                Pair('ㅡ', 'ㅣ') to 'ㅢ'
            )

            private val COMPLEX_CONSONANT = mapOf(
                Pair('ㄱ', 'ㅅ') to "ㄳ", Pair('ㄴ', 'ㅈ') to "ㄵ", Pair('ㄴ', 'ㅎ') to "ㄶ",
                Pair('ㄹ', 'ㄱ') to "ㄺ", Pair('ㄹ', 'ㅁ') to "ㄻ", Pair('ㄹ', 'ㅂ') to "ㄼ",
                Pair('ㄹ', 'ㅅ') to "ㄽ", Pair('ㄹ', 'ㅌ') to "ㄾ", Pair('ㄹ', 'ㅍ') to "ㄿ",
                Pair('ㄹ', 'ㅎ') to "ㅀ", Pair('ㅂ', 'ㅅ') to "ㅄ"
            )

            private val CATALOG = listOf(
                ContentUiModel(1, "기생충", "Parasite", "2019", "영화", setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY), listOf("기생충"), 95.0),
                ContentUiModel(2, "부산행", "Train to Busan", "2016", "영화", setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY), listOf("부산행"), 88.0),
                ContentUiModel(3, "언터처블: 1%의 우정", "The Intouchables", "2011", "영화", setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY), listOf("언터처블", "1%의 우정", "Intouchables"), 98.0),
                ContentUiModel(4, "언터처블", "The Untouchables", "1987", "영화", setOf(OttType.WAVVE), listOf("언터처블 1987"), 40.0),
                ContentUiModel(5, "워크 투 리멤버", "A Walk to Remember", "2002", "영화", setOf(OttType.WAVVE, OttType.COUPANG_PLAY), listOf("워크투리멤버"), 85.0),
                ContentUiModel(6, "무빙", "Moving", "2023", "시리즈", setOf(OttType.DISNEY_PLUS), listOf("무빙"), 94.0),
                ContentUiModel(7, "오징어 게임", "Squid Game", "2021", "시리즈", setOf(OttType.NETFLIX), listOf("오징어게임"), 96.0),
                ContentUiModel(8, "더 글로리", "The Glory", "2022", "시리즈", setOf(OttType.NETFLIX), listOf("더글로리"), 92.0),
                ContentUiModel(9, "소년시대", "Boyhood", "2023", "시리즈", setOf(OttType.COUPANG_PLAY), listOf("소년시대"), 89.0),
                ContentUiModel(10, "파묘", "Exhuma", "2024", "영화", setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY), listOf("파묘"), 91.0)
            )

            fun convertDubeolsik(input: String): String {
                val strokes = StringBuilder()
                for (ch in input) strokes.append(ENG_TO_KOR[ch] ?: ch)
                val s = strokes.toString()
                val result = StringBuilder()
                var i = 0
                val n = s.length
                while (i < n) {
                    val c = s[i]
                    if (c in CHOSUNG) {
                        val cho = c
                        if (i + 1 < n && s[i + 1] in JUNGSUNG) {
                            var jung = s[i + 1]
                            i += 2
                            if (i < n && COMPLEX_VOWEL.containsKey(Pair(jung, s[i]))) {
                                jung = COMPLEX_VOWEL[Pair(jung, s[i])]!!
                                i += 1
                            }
                            var jong = ""
                            if (i < n && JONGSUNG.contains(s[i].toString()) && s[i].toString().isNotEmpty()) {
                                if (!(i + 1 < n && s[i + 1] in JUNGSUNG)) {
                                    jong = s[i].toString()
                                    i += 1
                                    if (i < n && COMPLEX_CONSONANT.containsKey(Pair(jong[0], s[i]))) {
                                        if (!(i + 1 < n && s[i + 1] in JUNGSUNG)) {
                                            jong = COMPLEX_CONSONANT[Pair(jong[0], s[i])]!!
                                            i += 1
                                        }
                                    }
                                }
                            }
                            val choIdx = CHOSUNG.indexOf(cho)
                            val jungIdx = JUNGSUNG.indexOf(jung)
                            val jongIdx = JONGSUNG.indexOf(jong)
                            val unicode = 0xAC00 + (choIdx * 21 + jungIdx) * 28 + jongIdx
                            result.append(unicode.toChar())
                        } else {
                            result.append(cho)
                            i += 1
                        }
                    } else if (c in JUNGSUNG) {
                        var jung = c
                        i += 1
                        if (i < n && COMPLEX_VOWEL.containsKey(Pair(jung, s[i]))) {
                            jung = COMPLEX_VOWEL[Pair(jung, s[i])]!!
                            i += 1
                        }
                        result.append(jung)
                    } else {
                        result.append(c)
                        i += 1
                    }
                }
                return result.toString()
            }

            private fun norm(s: String): String = s.filter { !it.isWhitespace() }.lowercase()

            private fun levenshtein(s1: String, s2: String): Int {
                val dp = Array(s1.length + 1) { IntArray(s2.length + 1) }
                for (i in 0..s1.length) dp[i][0] = i
                for (j in 0..s2.length) dp[0][j] = j
                for (i in 1..s1.length) {
                    for (j in 1..s2.length) {
                        val cost = if (s1[i - 1] == s2[j - 1]) 0 else 1
                        dp[i][j] = minOf(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost)
                    }
                }
                return dp[s1.length][s2.length]
            }

            fun search(query: String): List<ContentUiModel> {
                val qRaw = query.trim()
                if (qRaw.isEmpty()) return CATALOG
                val qNorm = norm(qRaw)
                val qConv = convertDubeolsik(qRaw)
                val qConvNorm = norm(qConv)

                val scored = mutableListOf<Pair<ContentUiModel, Double>>()
                for (item in CATALOG) {
                    val candidates = mutableListOf(Pair(item.titleKo, 1.0), Pair(item.originalTitle, 0.95))
                    for (al in item.aliases) candidates.add(Pair(al, 1.0))

                    var best = 0.0
                    for ((cand, w) in candidates) {
                        val cRaw = cand.trim()
                        val cNorm = norm(cRaw)
                        val tier = when {
                            qRaw.equals(cRaw, ignoreCase = true) -> 10000.0
                            qNorm == cNorm -> 8000.0
                            qConv.isNotEmpty() && (qConv.equals(cRaw, ignoreCase = true) || qConvNorm == cNorm) -> 7500.0
                            cNorm.startsWith(qNorm) || qConvNorm.startsWith(cNorm) || cNorm.startsWith(qConvNorm) -> 5000.0
                            cNorm.contains(qNorm) || (qConvNorm.isNotEmpty() && cNorm.contains(qConvNorm)) -> 3000.0
                            else -> {
                                val d1 = levenshtein(qNorm, cNorm)
                                val d2 = if (qConvNorm.isNotEmpty()) levenshtein(qConvNorm, cNorm) else 99
                                val d = minOf(d1, d2)
                                val m = maxOf(qNorm.length, cNorm.length)
                                if (m > 0 && d <= 2) (1.0 - d.toDouble() / m) * 2000.0 else 0.0
                            }
                        }
                        val s = tier * w
                        if (s > best) best = s
                    }
                    if (best > 0.0) {
                        scored.add(Pair(item, best + item.popularity * 10.0))
                    }
                }

                val sorted = scored.sortedByDescending { it.second }.map { it.first }.toMutableList()
                val directTitle = if (qConv != qRaw && qConv.any { it in '가'..'힣' }) qConv else qRaw
                if (sorted.isEmpty()) {
                    sorted.add(
                        ContentUiModel(
                            id = 999,
                            titleKo = directTitle,
                            originalTitle = "OTT 앱 직접 검색",
                            year = "바로가기",
                            mediaType = "직접검색",
                            activeOtts = setOf(OttType.NETFLIX, OttType.WAVVE, OttType.COUPANG_PLAY, OttType.DISNEY_PLUS)
                        )
                    )
                }
                return sorted
            }
        }
        """

        files["app/src/main/java/com/ottsearch/app/ui/MainFoldableScreen.kt"] = """
        package com.ottsearch.app.ui

        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.grid.GridCells
        import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
        import androidx.compose.foundation.lazy.grid.items
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalConfiguration
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import com.ottsearch.app.core.HangulSearchEngine
        import com.ottsearch.app.ott.OttLauncher
        import com.ottsearch.app.ott.OttType

        data class ContentUiModel(
            val id: Int,
            val titleKo: String,
            val originalTitle: String,
            val year: String,
            val mediaType: String = "영화",
            val activeOtts: Set<OttType>,
            val aliases: List<String> = emptyList(),
            val popularity: Double = 50.0
        )

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun MainFoldableScreen(
            onSearch: (String) -> Unit,
            results: List<ContentUiModel>,
            currentQuery: String
        ) {
            val configuration = LocalConfiguration.current
            val gridColumns = if (configuration.screenWidthDp < 600) 1 else 2
            var textState by remember { mutableStateOf(currentQuery) }
            val context = LocalContext.current
            val convertedPreview = remember(textState) {
                val conv = HangulSearchEngine.convertDubeolsik(textState)
                if (conv != textState && conv.any { it in '가'..'힣' }) conv else ""
            }

            Scaffold(
                topBar = {
                    Column(
                        modifier = Modifier.fillMaxWidth().background(Color(20, 20, 20)).padding(16.dp)
                    ) {
                        Text("OTT SEARCH", color = Color(229, 9, 20), fontSize = 24.sp, fontWeight = FontWeight.Bold)
                        Spacer(modifier = Modifier.height(8.dp))
                        OutlinedTextField(
                            value = textState,
                            onValueChange = { textState = it; onSearch(it) },
                            modifier = Modifier.fillMaxWidth(),
                            placeholder = { Text("제목 입력 (예: 기생충, 언터처블, dnjzm xn flapaqj)", color = Color.Gray) },
                            singleLine = true
                        )
                        if (convertedPreview.isNotEmpty()) {
                            Spacer(modifier = Modifier.height(4.dp))
                            Text("한영 자동 변환 인식: $convertedPreview", color = Color(100, 200, 255), fontSize = 12.sp)
                        }
                    }
                },
                containerColor = Color(15, 15, 15)
            ) { paddingValues ->
                LazyVerticalGrid(
                    columns = GridCells.Fixed(gridColumns),
                    modifier = Modifier.fillMaxSize().padding(paddingValues).padding(12.dp),
                    verticalArrangement = Arrangement.spacedBy(12.dp),
                    horizontalArrangement = Arrangement.spacedBy(12.dp)
                ) {
                    items(results) { item ->
                        Card(
                            modifier = Modifier.fillMaxWidth(),
                            shape = RoundedCornerShape(10.dp),
                            colors = CardDefaults.cardColors(containerColor = Color(30, 30, 30))
                        ) {
                            Column(modifier = Modifier.padding(14.dp)) {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    Surface(
                                        color = Color(229, 9, 20),
                                        shape = RoundedCornerShape(4.dp)
                                    ) {
                                        Text(
                                            text = item.mediaType,
                                            color = Color.White,
                                            fontSize = 11.sp,
                                            fontWeight = FontWeight.Bold,
                                            modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp)
                                        )
                                    }
                                    Spacer(modifier = Modifier.width(8.dp))
                                    Text(
                                        text = item.titleKo,
                                        color = Color.White,
                                        fontWeight = FontWeight.Bold,
                                        fontSize = 18.sp,
                                        maxLines = 1,
                                        overflow = TextOverflow.Ellipsis
                                    )
                                }
                                Spacer(modifier = Modifier.height(4.dp))
                                Text(
                                    text = "${item.year} · ${item.originalTitle}",
                                    color = Color.LightGray,
                                    fontSize = 13.sp
                                )
                                Spacer(modifier = Modifier.height(12.dp))
                                Row(
                                    modifier = Modifier.fillMaxWidth(),
                                    horizontalArrangement = Arrangement.spacedBy(6.dp)
                                ) {
                                    for (ott in OttType.values()) {
                                        val isAvailable = item.activeOtts.contains(ott)
                                        Button(
                                            onClick = { OttLauncher.launch(context, ott, item.titleKo) },
                                            enabled = isAvailable,
                                            modifier = Modifier.weight(1f).height(36.dp),
                                            contentPadding = PaddingValues(2.dp),
                                            shape = RoundedCornerShape(6.dp),
                                            colors = ButtonDefaults.buttonColors(
                                                containerColor = Color(ott.r, ott.g, ott.b),
                                                disabledContainerColor = Color(50, 50, 50)
                                            )
                                        ) {
                                            Text(
                                                text = ott.displayName,
                                                color = if (isAvailable) Color.White else Color.Gray,
                                                fontSize = 11.sp,
                                                fontWeight = FontWeight.Bold,
                                                maxLines = 1
                                            )
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        """

        files["app/src/main/java/com/ottsearch/app/MainActivity.kt"] = """
        package com.ottsearch.app

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.runtime.*
        import com.ottsearch.app.core.HangulSearchEngine
        import com.ottsearch.app.ui.MainFoldableScreen

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    var query by remember { mutableStateOf("") }
                    val results = remember(query) {
                        HangulSearchEngine.search(query)
                    }
                    MainFoldableScreen(
                        onSearch = { query = it },
                        results = results,
                        currentQuery = query
                    )
                }
            }
        }
        """

        for path, content in files.items():
            os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
            with open(path, "w", encoding="utf-8") as f:
                f.write(content.strip())
        print("All files written cleanly without escape errors.")

    - name: Build Debug APK Directly
      run: |
        if gradle assembleDebug --no-daemon > build.log 2>&1; then
          echo "### ✅ OTT Search APK 빌드 성공!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ 빌드 오류 상세 원인" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILURE|What went wrong|Execution failed|^> |^e: )" -A 8 build.log >> $GITHUB_STEP_SUMMARY || tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log
          exit 1
        fi

    - name: Upload APK for Fold8
      uses: actions/upload-artifact@v4
      with:
        name: OTT-Search-Fold8.apk
        path: app/build/outputs/apk/debug/app-debug.apk
