name: Build DragOTT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle 8.5
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
        unzip -q gradle.zip -d /tmp
        echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Configure Android SDK Path
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Create Project Files
      shell: python
      run: |
        import os

        files = {}

        files["gradle.properties"] = """
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        """

        files["settings.gradle.kts"] = """
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DragOTT"
        include(":app")
        """

        files["build.gradle.kts"] = """
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        """

        files["app/build.gradle.kts"] = """
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.ottsearch.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.ottsearch.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 5
                versionName = "3.1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
            implementation("androidx.activity:activity-compose:1.8.1")
            implementation(platform("androidx.compose:compose-bom:2023.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.foundation:foundation")
