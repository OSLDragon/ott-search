        package com.ottsearch.app

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.runtime.*
        import com.ottsearch.app.core.HangulSearchEngine
        import com.ottsearch.app.ott.OttLauncher
        import com.ottsearch.app.ui.MainFoldableScreen

        class MainActivity : ComponentActivity() {
            private var isAutoSearchEnabled by mutableStateOf(false)

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                isAutoSearchEnabled = OttLauncher.isAccessibilityEnabled(this)
                setContent {
                    var query by remember { mutableStateOf("") }
                    val results = remember(query) {
                        HangulSearchEngine.search(query)
                    }
                    MainFoldableScreen(
                        onSearch = { query = it },
                        results = results,
                        currentQuery = query,
                        isAutoSearchEnabled = isAutoSearchEnabled
                    )
                }
            }

            override fun onResume() {
                super.onResume()
                isAutoSearchEnabled = OttLauncher.isAccessibilityEnabled(this)
            }
        }
        """

        for path, content in files.items():
            os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
            with open(path, "w", encoding="utf-8") as f:
                f.write(content.strip())
        print("All v2.1 files written cleanly.")

    - name: Build Debug APK Directly
      run: |
        if gradle assembleDebug --no-daemon > build.log 2>&1; then
          echo "### ✅ OTT Search v2.1 (프로필 선택 대기 + 자동 검색 엔진) APK 빌드 성공!" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ 빌드 오류 상세 원인" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILURE|What went wrong|Execution failed|^> |^e: )" -A 8 build.log >> $GITHUB_STEP_SUMMARY || tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build.log
          exit 1
        fi

