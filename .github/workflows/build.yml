        @Composable
        fun PosterThumbnail(item: ContentUiModel, modifier: Modifier = Modifier) {
            val cacheKey = item.posterUrl.ifBlank { item.titleKo }
            var imageBitmap by remember(cacheKey) { mutableStateOf(PosterBitmapCache.get(cacheKey)) }

            LaunchedEffect(cacheKey) {
                if (imageBitmap == null) {
                    withContext(Dispatchers.IO) {
                        try {
                            val targetUrl = item.posterUrl.ifBlank {
                                HangulSearchEngine.fetchPosterForTitle(item.titleKo)
