name: Build OTT Search APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle 8.5
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
        unzip -q gradle.zip -d /tmp
        echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Configure Android SDK Path
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Create Project Files
      shell: python
      run: |
        import os

        files = {}

        files["gradle.properties"] = """
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        """

        files["settings.gradle.kts"] = """
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "OTT-Search"
        include(":app")
        """

        files["build.gradle.kts"] = """
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        """

        files["app/build.gradle.kts"] = """
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.ottsearch.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.ottsearch.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 3
                versionName = "2.1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.6.2")
            implementation("androidx.activity:activity-compose:1.8.1")
            implementation(platform("androidx.compose:compose-bom:2023.10.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.foundation:foundation")
        }
        """

        files["app/src/main/res/values/strings.xml"] = """
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">OTT Search</string>
            <string name="accessibility_service_desc">OTT 버튼을 눌렀을 때 프로필 선택 후 자동으로 돋보기(검색)로 이동해 검색어를 입력하고 엔터까지 눌러주는 기능입니다.</string>
        </resources>
        """

        files["app/src/main/res/xml/accessibility_service_config.xml"] = """
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_service_desc"
            android:notificationTimeout="100" />
        """

        files["app/src/main/AndroidManifest.xml"] = """
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <queries>
                <package android:name="com.netflix.mediaclient" />
                <package android:name="kr.co.captv.pooqV2" />
                <package android:name="com.coupang.mobile.play" />
                <package android:name="com.disney.disneyplus" />
                <intent>
                    <action android:name="android.intent.action.VIEW" />
                    <data android:scheme="https" />
                </intent>
                <intent>
                    <action android:name="android.intent.action.SEARCH" />
                </intent>
            </queries>

            <application
                android:allowBackup="true"
